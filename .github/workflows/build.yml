# File này nằm tại: .github/workflows/build.yml
# Mỗi khi ai trong nhóm push code lên GitHub hoặc tạo Pull Request,
# GitHub sẽ tự động chạy file này để build và test dự án.
# Nếu test thất bại → GitHub báo đỏ, nhắc nhở trước khi merge code.

name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build toàn bộ project, skip test ở bước này
      - name: Build with Maven
        run: mvn -B clean package -DskipTests
        working-directory: AuctionSystemApplication

      # Chạy test không cần DB — exclude các test cần kết nối MySQL
      # Các class test cần DB đặt tên kết thúc bằng "DBTest" để dễ exclude
      - name: Run unit tests (no DB required)
        run: mvn -B test -Dgroups="!db" -pl .
        working-directory: AuctionSystemApplication
        # Nếu dùng tag @Tag("db") trên test cần DB thì lệnh trên sẽ skip chúng
        # Hiện tại các test đã viết (UserService, UserSession, SessionManager)
        # đều không cần DB nên sẽ chạy bình thường

      # (Tùy chọn) Khi muốn chạy test cần DB: cấu hình MySQL service bên dưới
      # và bỏ comment block này
      # - name: Run all tests including DB
      #   run: mvn -B test
      #   working-directory: AuctionSystemApplication
