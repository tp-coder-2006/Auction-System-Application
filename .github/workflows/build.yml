# File này nằm tại: .github/workflows/build.yml
# Mỗi khi ai trong nhóm push code lên GitHub hoặc tạo Pull Request,
# GitHub sẽ tự động chạy file này để build và test dự án.
# Nếu test thất bại → GitHub báo đỏ, nhắc nhở trước khi merge code.

name: Build & Test

on:
  push:
    branches: [ main, master ]   # Chạy khi push lên nhánh chính
  pull_request:
    branches: [ main, master ]   # Chạy khi tạo Pull Request

jobs:
  build:
    runs-on: ubuntu-latest       # Chạy trên máy ảo Ubuntu của GitHub

    steps:
      # Bước 1: Lấy code từ repository về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Cài đặt Java 21 (dùng Temurin vì nó miễn phí và ổn định)
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven            # Cache thư viện Maven để lần sau build nhanh hơn

      # Bước 3: Build dự án và bỏ qua test có kết nối DB
      # (vì môi trường CI không có MySQL, chỉ test những gì không cần DB)
      # Khi nhóm muốn chạy test thật thì xóa -DskipTests đi và cấu hình DB trong CI
      - name: Build with Maven
        run: mvn -B clean package -DskipTests
        working-directory: AuctionSystemApplication

      # Bước 4: (Tùy chọn) Chạy test nếu nhóm đã cấu hình DB trong CI
      # Hiện tại comment lại vì CI chưa có MySQL
      # - name: Run tests
      #   run: mvn -B test
      #   working-directory: AuctionSystemApplication