# .github/workflows/build.yml
# Tự động chạy mỗi khi push hoặc tạo Pull Request lên main/master.
# Gồm 2 job:
#   1. build-and-test  : build + unit test, chạy song song trên Ubuntu/Windows/macOS
#   2. integration-test: test cần MySQL thật, chỉ chạy trên Ubuntu (MySQL service)

name: Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1: Build + Unit Test — Matrix Build (3 OS song song)
  # GitHub tạo ra 3 job chạy đồng thời: Ubuntu, Windows, macOS
  # ─────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
      fail-fast: false   # 1 OS fail không dừng 2 OS còn lại

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build (skip tests)
        run: mvn -B clean package -DskipTests
        working-directory: AuctionSystemApplication

      # Chạy tất cả test, loại trừ @Tag("integration") vì cần DB thật
      - name: Run unit tests
        run: mvn -B test -Dgroups="!integration"
        working-directory: AuctionSystemApplication

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report-${{ matrix.os }}
          path: AuctionSystemApplication/target/surefire-reports/

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Integration Test (cần MySQL) — chỉ chạy trên Ubuntu
  # MySQL service chỉ hỗ trợ Linux runner, không dùng được trên Windows/macOS
  # ─────────────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests (with MySQL)
    runs-on: ubuntu-latest
    needs: build-and-test   # chỉ chạy nếu cả 3 OS ở job 1 đều pass

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: auction_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Init database schema
        run: |
          mysql -h 127.0.0.1 -uroot -proot auction_system \
            < AuctionSystemApplication/database/init_database.sql

      - name: Run integration tests
        run: mvn -B test -Dgroups="integration"
        working-directory: AuctionSystemApplication
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/auction_system
          DB_USER: root
          DB_PASSWORD: root

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: AuctionSystemApplication/target/surefire-reports/